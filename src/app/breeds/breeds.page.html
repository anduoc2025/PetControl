<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Razas de perros</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="loadBreeds()">
        <ion-icon slot="icon-only" name="refresh-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <p class="intro">Información obtenida en línea desde una API REST pública (dog.ceo).</p>

  <ion-chip color="warning" *ngIf="offline">
    <ion-icon name="cloud-offline-outline"></ion-icon>
    <ion-label>Modo sin conexión (datos guardados)</ion-label>
  </ion-chip>

  <div class="center" *ngIf="loading">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Cargando razas...</p>
  </div>

  <ion-card *ngIf="selectedBreed">
    <img *ngIf="selectedImage" [src]="selectedImage" alt="Imagen de la raza" />
    <div class="center" *ngIf="!selectedImage" style="padding: 20px;">
      <ion-spinner name="dots"></ion-spinner>
    </div>
    <ion-card-header>
      <ion-card-title class="cap">{{ selectedBreed }}</ion-card-title>
    </ion-card-header>
  </ion-card>

  <ion-list *ngIf="!loading">
    <ion-item *ngFor="let breed of breeds" button (click)="showImage(breed)">
      <ion-icon name="paw-outline" slot="start" color="primary"></ion-icon>
      <ion-label class="cap">{{ breed }}</ion-label>
      <ion-icon name="image-outline" slot="end" color="medium"></ion-icon>
    </ion-item>
  </ion-list>
</ion-content>
